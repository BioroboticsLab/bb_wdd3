data_path: ../../../data

subfolders:
  - name: videos

# Videos are grouped by source recording automatically (same duration/fps/frame
# count under different resolution tags = same footage, just re-encoded). Only
# the highest-resolution copy of each sampled source gets annotated; the
# measured diameter is then projected exactly to every sibling resolution.
n_videos: 1       # camera position/distance is fixed per lab, so one source
                  # recording's measurement should hold for the whole lab --
                  # extra recordings would just re-measure the same constant.
n_frames: 1       # camera is stationary -- extra frames from the same recording
                  # just re-measure the same cells at the same distance, so 1 is
                  # enough. Annotate several cells within that frame instead.

shape: circle     # circle or hexagon

save_csv: true    # save annotations to a CSV file when done
