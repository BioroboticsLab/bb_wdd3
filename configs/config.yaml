# Data configuration
data:
  data_dir: './data/videos/'
  annotations: './data/annotations/fps_multires_clean.csv'
  train_ratio: 0.90
  subset_size: 1.0
  width: 224
  height: 224
  window_size: 16 # defines max clip length
  data_fraction_divisor: 1   # 1=full, 2=half, 4=quarter, 16=1/16th, etc.

# Training augmentations configuration
augmentations:
  width: 224
  height: 224
  prob_flip_h: 0.5
  prob_flip_v: 0.0
  prob_rotate: 0.3 
  rotate_range: [-40, 40]
  prob_scale: 0.3
  scale_range: [0.9, 1.1]
  prob_translate: 0.3
  translate_range: 0.1
  prob_hsv: 0.0
  hsv_hue: 0.1
  hsv_saturation: 0.9
  hsv_value: 0.9
  prob_brightness: 0.3
  brightness_range: 0.4
  prob_contrast: 0.3
  contrast_range: 0.4
  prob_gamma: 0.0
  gamma_range: [0.8, 1.2]
  prob_blur: 0.1
  blur_range: [0.5, 2.0]
  prob_clahe: 0.1
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]
  prob_color_shuffle: 0.0
  prob_posterize: 0.0
  posterize_bits: [4, 7]
  prob_greyscale: 0.0
  normalize: true
  mean: [0.1964, 0.1964, 0.1964]
  std: [0.1898, 0.1898, 0.1898]
  temporal_jitter: False

# Model configuration
model:
  pretrained: True
  self_attention: False
  cross_attention: True
  transformer_heads: 4
  transformer_layers: 4
  dropout: 0.0 # 0.3
  max_detections_per_cell: 1
  grid_size: 28
  n_classes: 1


# Training configuration
train:
  batch_size: 32
  epochs: 100
  lr: 0.0001
  weight_decay: 0.0005
  val_freq: 1
  use_amp: true
  warmup_ratio: 0.03 # 3 epochs if we train fo 200 epochs
  num_workers: 4
  save_model: True
  betas: [0.937, 0.999]
  ema_decay: 0.9999

val:
    batch_size: 32

post_process:
  spatial_threshold: 30
  temporal_threshold: 8
  confidence_threshold: 0.0 # disable confidence filtering bcs only max=5 prediction pass
  strategy: 'cluster_consolidate' # support various stategies see 
  mode: 'median'
  outlier_detection: False

# Loss parameters
loss:
  lambda_obj: 5.0
  lambda_coord: 7.5
  lambda_noobj: 0.7
  lambda_direction: 7.5
  lambda_temporal: 7.5 
  use_varifocal: False  # use varifocal loss to link confidence with localization quality
  varifocal_gamma: 2.0  # focusing parameter for hard examples (higher = more focus)
  quality_decay: 'exponential'  # 'exponential', 'gaussian', or 'linear'
  grid_size: 28
  input_size: 224

# System configuration
system:
  seed: 42
  num_workers: 4
  device: 'cuda'

# Logging configuration
logging:
  log_dir: './logs'
  checkpoint_dir: './checkpoints'

# Evaluation configuration
eval:
  batch_size: 64
  confidence_threshold: 0.001
  consolidation_strategy: 'cluster_consolidate'
  pos_thresholds: [10, 15, 20, 25, 30]
  iou_thresholds: [0.25, 0.75]
  angular_thresholds: [10, 15, 20]
  metric: loss # support for loss and spatio-tempral-direction mAP or in short std_map
  match_pairs: hungarian # match pred to gt using either geedy or hungarian algo
  max_dets: 5 # maximal number of prediciton per frame/window
  map_freq: 5 # compute expensive STD-mAP every N epochs (+ always on last epoch)