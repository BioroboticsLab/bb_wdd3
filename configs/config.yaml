# Data configuration
data:
  data_dir: './data/videos/'
  annotations: './data/annotations/fps_multires_full_data.csv'
  train_ratio: 0.75
  subset_size: 1.0

# Model configuration
model:
  pretrained: True

# Training configuration
train:
  batch_size: 16
  epochs: 100
  lr: 0.0001
  weight_decay: 0.0005
  val_freq: 1
  use_amp: true
  warmup_ratio: 0.1 # onecycle warmup ratio
  num_workers: 8
  save_model: True

val:
    batch_size: 32

post_process:
  spatial_threshold: 40
  temporal_threshold: 7
  confidence_threshold: 0.95
  strategy: 'cluster_consolidate'
  mode: 'median'

# Loss parameters
loss:
  lambda_obj: 2.0
  lambda_coord: 7.5
  lambda_noobj: 2.0
  lambda_direction: 7.0
  lambda_temporal: 7.0
  use_varifocal: False  # use varifocal loss to link confidence with localization quality
  varifocal_gamma: 2.0  # focusing parameter for hard examples (higher = more focus)
  varifocal_quality_scale: 0.10  # quality decay scale: predictions ~22px off get 37% quality weight
  
# System configuration
system:
  seed: 42
  num_workers: 8
  device: 'cuda'

# Logging configuration
logging:
  log_dir: './logs'
  checkpoint_dir: './checkpoints'

# Evaluation configuration
eval:
  confidence_threshold: 0.99
  consolidation_strategy: 'cluster_consolidate'
  pos_thresholds: [20]
  iou_thresholds: [0.5]
  angular_thresholds: [15]